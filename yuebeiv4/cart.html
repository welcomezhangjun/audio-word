<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 悦倍国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #F8F9FA;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        .status-bar {
            background: white;
            height: 48px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            border-bottom: 1px solid #E5E5E5;
        }
        .nav-header {
            background: white;
            height: 44px;
            position: sticky;
            top: 48px;
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #E5E5E5;
        }
        .scroll-container {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 80px;
        }
        .cart-item {
            background: white;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
        }
        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #D1D5DB;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checkbox-custom.checked {
            background: #2F6BFF;
            border-color: #2F6BFF;
        }
        .checkbox-custom.checked::after {
            content: '\2713';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .action-bar {
            position: fixed;
            bottom: 0;
            width: 393px;
            background: white;
            border-top: 1px solid #E5E5E5;
            padding: 12px 16px;
            z-index: 100;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
        }
        .stepper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stepper button {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #E5E5E5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            cursor: pointer;
            color: #666666;
        }
        .stepper button:hover {
            background: #F8F9FA;
        }
        .stepper input {
            width: 40px;
            text-align: center;
            border: none;
            font-size: 14px;
            color: #1A1A1A;
        }
        .empty-cart {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="flex items-center gap-1">
                <span class="text-sm font-medium" style="color: #1A1A1A;">9:41</span>
            </div>
            <div class="flex items-center gap-1" style="color: #1A1A1A;">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- 导航头 -->
        <div class="nav-header">
            <i class="fas fa-chevron-left mr-4" style="color: #666666;"></i>
            <h1 class="flex-1 text-center font-medium text-base" style="color: #1A1A1A;">购物车</h1>
            <span class="text-sm" style="color: #666666;">管理</span>
        </div>

        <!-- 内容区域 -->
        <div class="scroll-container">
            <div class="px-4 py-3">
                <!-- 全选区域 -->
                <div class="flex items-center justify-between mb-3 px-2">
                    <div class="flex items-center gap-2">
                        <div class="checkbox-custom checked"></div>
                        <span class="text-sm font-medium" style="color: #1A1A1A;">全选</span>
                    </div>
                    <span class="text-sm" style="color: #666666;">共5件商品</span>
                </div>

                <!-- 购物车商品列表 -->
                <div class="space-y-3">
                    <!-- 商品1 -->
                    <div class="cart-item">
                        <div class="checkbox-custom checked"></div>
                        <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=200&h=200&fit=crop"
                             alt="课程" class="w-20 h-20 rounded-lg object-cover">
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-medium mb-1 line-clamp-2" style="color: #1A1A1A;">
                                    高效能人士的七个习惯
                                </h3>
                                <p class="text-xs mb-2" style="color: #999999;">线上课程 · 培训中心</p>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-semibold" style="color: #D4A574; font-size: 16px;">¥3,999</span>
                                <span class="text-sm" style="color: #666666;">x 1</span>
                            </div>
                        </div>
                    </div>

                    <!-- 商品2 -->
                    <div class="cart-item">
                        <div class="checkbox-custom checked"></div>
                        <img src="https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=200&h=200&fit=crop"
                             alt="课程" class="w-20 h-20 rounded-lg object-cover">
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-medium mb-1 line-clamp-2" style="color: #1A1A1A;">
                                    正念领导力：VUCA时代的领导之道
                                </h3>
                                <p class="text-xs mb-2" style="color: #999999;">线上课程 · 培训中心</p>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-semibold" style="color: #D4A574; font-size: 16px;">¥4,999</span>
                                <span class="text-sm" style="color: #666666;">x 1</span>
                            </div>
                        </div>
                    </div>

                    <!-- 商品3 -->
                    <div class="cart-item">
                        <div class="checkbox-custom checked"></div>
                        <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=200&h=200&fit=crop"
                             alt="教练服务" class="w-20 h-20 rounded-lg object-cover">
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-medium mb-1 line-clamp-2" style="color: #1A1A1A;">
                                    一对一高管教练 - 王明教练
                                </h3>
                                <p class="text-xs mb-2" style="color: #999999;">教练服务 · 3个月套餐</p>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-semibold" style="color: #D4A574; font-size: 16px;">¥18,000</span>
                                <span class="text-sm" style="color: #666666;">x 1</span>
                            </div>
                        </div>
                    </div>

                    <!-- 商品4 - PCC教练服务 -->
                    <div class="cart-item">
                        <div class="checkbox-custom checked"></div>
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop"
                             alt="PCC教练" class="w-20 h-20 rounded-lg object-cover">
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-medium mb-1 line-clamp-2" style="color: #1A1A1A;">
                                    PCC资深教练服务（60分钟）
                                </h3>
                                <p class="text-xs mb-2" style="color: #999999;">教练中心 · 单次服务</p>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-semibold" style="color: #D4A574; font-size: 16px;">¥1,200</span>
                                <span class="text-sm" style="color: #666666;">x 1</span>
                            </div>
                        </div>
                    </div>

                    <!-- 商品5 - ACC教练服务 -->
                    <div class="cart-item">
                        <div class="checkbox-custom checked"></div>
                        <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&h=200&fit=crop"
                             alt="ACC教练" class="w-20 h-20 rounded-lg object-cover">
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-medium mb-1 line-clamp-2" style="color: #1A1A1A;">
                                    ACC专业教练服务（60分钟）
                                </h3>
                                <p class="text-xs mb-2" style="color: #999999;">教练中心 · 单次服务</p>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-semibold" style="color: #D4A574; font-size: 16px;">¥800</span>
                                <span class="text-sm" style="color: #666666;">x 1</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部操作栏 -->
        <div class="action-bar">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div class="checkbox-custom checked"></div>
                    <span class="text-sm" style="color: #666666;">全选</span>
                </div>
                <div class="text-right">
                    <div class="text-xs" style="color: #666666;">
                        合计: <span class="text-sm font-semibold" style="color: #D4A574;">¥28,998</span>
                    </div>
                </div>
            </div>
            <button class="w-full py-3 rounded-full font-medium text-white" style="background: #D4A574;">
                去结算 (5)
            </button>
        </div>

    </div>
</body>
</html>
